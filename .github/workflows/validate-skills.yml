name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/validate-skills.sh

  native-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native observations without desktop interaction
        shell: powershell
        run: ./tests/native-probe.test.ps1
